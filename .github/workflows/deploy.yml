name: Deploy

# Manual for now. Switch the trigger to `push: branches: [main]` once the
# secrets below exist and the first manual deploy has worked.
on:
  workflow_dispatch:

# Required repository secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST         server IP / hostname
#   SSH_USER         login user (must be able to run docker)
#   SSH_KEY          private key (PEM) for that user
#   SSH_KNOWN_HOSTS  output of:  ssh-keyscan -H <server>
#   DEPLOY_PATH      absolute path of the cloned repo on the server
# The server also needs its own .env (never committed) next to docker-compose.yml.

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && git pull --ff-only && docker compose up -d --build && docker image prune -f"

      - name: Smoke test
        run: |
          sleep 20
          curl --fail --silent --show-error "http://${{ secrets.SSH_HOST }}/api/auth/health" || \
          curl --fail --silent --show-error "http://${{ secrets.SSH_HOST }}/" > /dev/null
