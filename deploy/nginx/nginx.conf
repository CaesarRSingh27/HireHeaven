worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;
  gzip          on;
  gzip_types    text/css application/javascript application/json image/svg+xml;

  # Accept 25 MB browser uploads and allow headroom for base64 JSON uploads.
  client_max_body_size 40m;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # Docker assigns new container IPs when services are rebuilt. Refresh
  # upstream DNS so the gateway keeps reaching recreated services.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  upstream frontend_app { zone frontend_app 64k; server frontend:3000 resolve; }
  upstream auth_svc     { zone auth_svc 64k; server auth:5000 resolve; }
  upstream utils_svc    { zone utils_svc 64k; server utils:5001 resolve; }
  upstream user_svc     { zone user_svc 64k; server user:5002 resolve; }
  upstream job_svc      { zone job_svc 64k; server job:5003 resolve; }
  upstream payment_svc  { zone payment_svc 64k; server payment:5004 resolve; }

  server {
    listen 80;
    server_name _;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 90s;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Internal-only endpoints: backend services call these directly on the
    # docker network; they must never be reachable from the internet.
    location ~ ^/api/utils/(upload|delete)/?$ { return 404; }

    location /api/auth/    { limit_req zone=api burst=40 nodelay; proxy_pass http://auth_svc; }
    location /api/user/    { limit_req zone=api burst=40 nodelay; proxy_pass http://user_svc; }
    location /api/job/     { limit_req zone=api burst=40 nodelay; proxy_pass http://job_svc; }
    location /api/payment/ { limit_req zone=api burst=40 nodelay; proxy_pass http://payment_svc; }
    location /api/utils/   { limit_req zone=api burst=10 nodelay; proxy_pass http://utils_svc; }

    location / { proxy_pass http://frontend_app; }
  }
}
