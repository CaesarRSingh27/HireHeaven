# Job Portal - full stack. Usage:  cp .env.example .env  (fill in)  &&  docker compose up -d --build
name: job-portal

x-service: &svc
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ---------- infrastructure ----------
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    networks: [backend]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092   # reachable by other containers
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- backend services ----------
  utils:
    <<: *svc
    build:
      context: ./services/utils
      args:
        PORT: 5001
    environment:
      PORT: 5001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in .env}
      API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env}
      API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env}
      Kafka_Broker: kafka:9092
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?set SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:-}
      API_KEY_GEMINI: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
    depends_on:
      kafka: { condition: service_healthy }

  auth:
    <<: *svc
    build:
      context: ./services/auth
      args:
        PORT: 5000
    environment:
      PORT: 5000
      DB_URL: ${DB_URL:?set DB_URL in .env}
      UPLOAD_SERVICE: http://utils:5001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SEC: ${JWT_SEC:?set JWT_SEC in .env}
      Kafka_Broker: kafka:9092
      Redis_url: redis://redis:6379
      Frontend_Url: ${PUBLIC_URL:-http://localhost}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      utils: { condition: service_healthy }

  job:
    <<: *svc
    build:
      context: ./services/job
      args:
        PORT: 5003
    environment:
      PORT: 5003
      DB_URL: ${DB_URL}
      UPLOAD_SERVICE: http://utils:5001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SEC: ${JWT_SEC}
      Kafka_Broker: kafka:9092
    depends_on:
      auth: { condition: service_healthy }
      kafka: { condition: service_healthy }
      utils: { condition: service_healthy }

  user:
    <<: *svc
    build:
      context: ./services/user
      args:
        PORT: 5002
    environment:
      PORT: 5002
      DB_URL: ${DB_URL}
      UPLOAD_SERVICE: http://utils:5001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      JWT_SEC: ${JWT_SEC}
    depends_on:
      job: { condition: service_healthy }
      utils: { condition: service_healthy }

  payment:
    <<: *svc
    build:
      context: ./services/payment
      args:
        PORT: 5004
    environment:
      PORT: 5004
      DB_URL: ${DB_URL}
      JWT_SEC: ${JWT_SEC}
      Razorpay_Key: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      Razorpay_Secret: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      Razorpay_Webhook_Secret: ${RAZORPAY_WEBHOOK_SECRET:-}
      SUBSCRIPTION_PRICE_INR: ${SUBSCRIPTION_PRICE_INR:-119}
    depends_on:
      auth: { condition: service_healthy }

  # ---------- frontend + gateway ----------
  frontend:
    <<: *svc
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""          # same-origin: nginx routes /api/*
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      frontend: { condition: service_healthy }
      auth: { condition: service_healthy }
      job: { condition: service_healthy }
      user: { condition: service_healthy }
      payment: { condition: service_healthy }
      utils: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional Let's Encrypt renewal loop:  docker compose --profile tls up -d certbot
  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    networks: [backend]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  backend:

volumes:
  kafka-data:
  redis-data:
